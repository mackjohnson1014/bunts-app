<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Unruly Bunts</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Companion app for the Unruly Bunts fantasy baseball league." />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#F5F4ED" />

    <!--
      Sets data-theme (and the theme-color above) before the stylesheet
      paints, so a returning dark-mode reader never sees a flash of light.
      Must stay in sync with the default and storage key in src/useTheme.ts.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('bunts-theme');
          var theme = stored === 'dark' ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          if (theme === 'dark') {
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#101A13');
          }
        } catch (e) {
          // localStorage unavailable -- light default from the meta tag above stands.
        }
      })();
    </script>

    <!-- iOS reads these when the page is added to the home screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Unruly Bunts" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
