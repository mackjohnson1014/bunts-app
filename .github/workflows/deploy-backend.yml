name: Deploy backend

# Manual only. Mack deploys from his Mac with `npm run deploy`, which needs no
# stored credential. Running this on push would require a Cloudflare API token
# in the repo's Actions secrets -- worth adding only if automatic deploys are
# actually wanted, not as the price of a green tick.
#
# To enable: add CLOUDFLARE_API_TOKEN under
# Settings > Secrets and variables > Actions, then run this from the Actions tab.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Fail early without a token
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install
        working-directory: backend
        run: npm ci

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Deploy
        working-directory: backend
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
