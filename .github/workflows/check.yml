name: Check

# Typechecks what actually ships: the PWA and the Worker.
# mobile/ is the parked Expo app and is deliberately not covered.

on:
  push:
    branches: [main]
    paths: ['web/**', 'backend/**', '.github/workflows/check.yml']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # a broken backend should not hide a broken web build
      matrix:
        project: [web, backend]
    name: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install
        working-directory: ${{ matrix.project }}
        run: npm ci

      - name: Typecheck
        working-directory: ${{ matrix.project }}
        run: npm run typecheck
