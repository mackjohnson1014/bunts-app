name: Check mobile

# The Expo app is parked while the PWA is the primary surface. Kept runnable by
# hand so the option stays alive, but not run on every push.

on:
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: mobile
        run: npm install
      - name: Typecheck
        working-directory: mobile
        run: npm run typecheck
