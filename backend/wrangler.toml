name = "bunts-backend"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Every 5 minutes between 15:00 and 02:59 UTC (11am-10:59pm Eastern), which
# covers lineup postings and every first pitch. The 5-minute beat is for the
# "20 minutes to first pitch, still undecided" suggestion warning; the Yahoo
# pollers skip every other run so they stay at 10 minutes -- Yahoo publishes
# no rate limits but reserves the right to throttle bursty usage.
[triggers]
crons = ["*/5 15-23,0-2 * * *"]

[[kv_namespaces]]
binding = "BUNTS"
id = "45b7f915a8d94bbdb29b2ae6ef495401"          # wrangler kv namespace create BUNTS
preview_id = "45b7f915a8d94bbdb29b2ae6ef495401"

[vars]
# Non-secret config. Secrets go through `wrangler secret put`:
#   YAHOO_CLIENT_ID, YAHOO_CLIENT_SECRET, YAHOO_REFRESH_TOKEN, APP_SECRET
LEAGUE_KEY = ""                    # e.g. "458.l.123456" -- fill in once known
TEAM_KEY = ""                      # e.g. "458.l.123456.t.4"
