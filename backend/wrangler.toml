name = "bunts-backend"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Poll for lineup changes. Yahoo publishes no rate limits but reserves the right
# to throttle bursty usage, so this runs on a minutes scale, not seconds.
# Every 10 minutes between 15:00 and 02:00 UTC covers 11am-10pm Eastern,
# which is when MLB lineups actually get posted.
[triggers]
crons = ["*/10 15-23,0-2 * * *"]

[[kv_namespaces]]
binding = "BUNTS"
id = "45b7f915a8d94bbdb29b2ae6ef495401"          # wrangler kv namespace create BUNTS
preview_id = "45b7f915a8d94bbdb29b2ae6ef495401"

[vars]
# Non-secret config. Secrets go through `wrangler secret put`:
#   YAHOO_CLIENT_ID, YAHOO_CLIENT_SECRET, YAHOO_REFRESH_TOKEN, APP_SECRET
LEAGUE_KEY = ""                    # e.g. "458.l.123456" -- fill in once known
TEAM_KEY = ""                      # e.g. "458.l.123456.t.4"
